[package]
name = "schema-tools-tests-tokio-rmq"
version = "0.1.0"
edition = "2024"

[dependencies]
# messages (rust/rabbitmq-tokio)
lapin = "4.13.0"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
arc-swap = "1"
rustc-hash = "2"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
garde = { version = "0.22.0", features = ["derive", "regex"] }

# tracing (trace.rs is always generated)
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-opentelemetry = "0.28.0"
opentelemetry = { version = "0.27.1", features = ["trace"] }
opentelemetry_sdk = "0.27.1"
