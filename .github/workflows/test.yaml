on:
  pull_request: {}
  push:
    branches:
      - master

name: test

jobs:
  check:
    strategy:
      matrix:
        tests: [ rust, rust-axum, rust-axum-relaxed, rust-tokio-rmq ]
    name: Check rust sample application (${{ matrix.tests }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2
      - name: Install protobuf
        run: sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: make codegen
        working-directory: ./tests/${{ matrix.tests }}
      - name: Run cargo check
        uses: actions-rs/cargo@v1
        with:
          command: check
          args: --manifest-path ./tests/${{ matrix.tests }}/Cargo.toml

  test:
    strategy:
      matrix:
        tests: [ rust, rust-axum, rust-axum-relaxed, rust-tokio-rmq ]
    name: Test rust sample application (${{ matrix.tests }})
    runs-on: ubuntu-latest
    services:
      # used by tests/rust-tokio-rmq (AMQP_URI defaults to localhost:5672)
      rabbitmq:
        image: rabbitmq:4
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2
      - name: Install protobuf
        run: sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: make codegen
        working-directory: ./tests/${{ matrix.tests }}
      - name: Run cargo test
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --manifest-path ./tests/${{ matrix.tests }}/Cargo.toml

  # todo: consider adding lint, clippy, fmt and fixing all issues
